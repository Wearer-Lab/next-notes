name: macOS

# Runs the shared dictionary contract against the Swift implementation. The Windows
# workflow runs the identical vectors against the C# one. Both must be green for the two
# implementations to be considered in agreement — that pairing is the whole point.

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary-contract:
    name: Dictionary contract
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # The app target needs macOS 26 and the Speech framework, which the runner image
      # does not have. The dictionary target is deliberately platform-neutral, so it — and
      # the contract that matters here — builds and tests anywhere.
      - name: Test the dictionary target
        run: swift test --filter VectorTests

      - name: Confirm the vectors on both sides are identical
        run: |
          if ! diff -q shared/dictionary-test-vectors.json Tests/MurmurDictionaryTests/dictionary-test-vectors.json; then
            echo "::error::The Swift test copy of the vectors has drifted from shared/."
            echo "Run: cp shared/dictionary-test-vectors.json Tests/MurmurDictionaryTests/"
            exit 1
          fi
          echo "Vectors match."
